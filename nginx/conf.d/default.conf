limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=kiosk_limit:10m rate=20r/m;

server_tokens off;

server {
    listen 80;
    server_name mis.crc.pshs.edu.ph;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mis.crc.pshs.edu.ph;

    ssl_certificate     /etc/nginx/ssl/cloudflare.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    client_max_body_size 20M;

    root  /var/www/public;
    index index.php index.html;

    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;

    add_header X-Frame-Options            "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options     "nosniff"                             always;
    add_header X-XSS-Protection           "1; mode=block"                       always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

    location = /login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        add_header Cross-Origin-Opener-Policy "unsafe-none" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /google/login {
        add_header Cross-Origin-Opener-Policy "unsafe-none" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /forgot-password {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(library|clinic|guidance)/kiosk {
        limit_req zone=kiosk_limit burst=10 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    location ~ /storage/app/db_backups {
        deny all;
        return 404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_param  HTTPS on;
        fastcgi_read_timeout  120;
        fastcgi_send_timeout  120;
        fastcgi_connect_timeout 10;
        fastcgi_buffers       16 16k;
        fastcgi_buffer_size   32k;
    }

    location /app/ {
        proxy_pass         http://127.0.0.1:9601;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /apps/ {
        proxy_pass         http://127.0.0.1:9601;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location = /_status {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
