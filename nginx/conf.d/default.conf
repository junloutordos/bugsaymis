# ─── Rate limiting zones ──────────────────────────────────────────────────────
# Login: 5 req/min per IP (burst of 10 queued, after that 429)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
# API / general: 60 req/min per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
# Kiosk scans: 20 req/min per IP
limit_req_zone $binary_remote_addr zone=kiosk_limit:10m rate=20r/m;

# ─── Hide Nginx version ───────────────────────────────────────────────────────
server_tokens off;

# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name bugsaymis.online www.bugsaymis.online;
    return 301 https://$host$request_uri;
}

# ─── HTTPS main server ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name bugsaymis.online www.bugsaymis.online;

    # ── SSL Certificate (Cloudflare Origin) ───────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/cloudflare.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare.key;

    # ── TLS hardening: TLS 1.2+ only, strong ciphers ─────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Upload size ───────────────────────────────────────────────────────────
    client_max_body_size 20M;

    root  /var/www/public;
    index index.php index.html;

    # ── Trust Cloudflare proxy IPs for real client IP ─────────────────────────
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"                                          always;
    add_header X-Content-Type-Options     "nosniff"                                             always;
    add_header X-XSS-Protection           "1; mode=block"                                       always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"                     always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains"                 always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com https://www.gstatic.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.bunny.net; font-src 'self' https://fonts.gstatic.com https://fonts.bunny.net data:; img-src 'self' data: blob: https:; connect-src 'self' wss://bugsaymis.online https://bugsaymis.online https://securetoken.googleapis.com https://identitytoolkit.googleapis.com https://firebaseapp.com https://www.googleapis.com https://cloudflareinsights.com; frame-src 'self' https://accounts.google.com https://*.firebaseapp.com; frame-ancestors 'self'; object-src 'none';" always;

    # ── Rate-limited: login & password reset ──────────────────────────────────
    # COOP must be unsafe-none on login page so Firebase popup can communicate
    # with the parent window (window.closed / window.close checks)
    location = /login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        add_header Cross-Origin-Opener-Policy "unsafe-none" always;
        add_header X-Frame-Options            "SAMEORIGIN"  always;
        add_header X-Content-Type-Options     "nosniff"     always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /google/login {
        add_header Cross-Origin-Opener-Policy "unsafe-none" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /forgot-password {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Rate-limited: kiosk scan endpoints ────────────────────────────────────
    location ~ ^/(library|clinic|guidance)/kiosk {
        limit_req zone=kiosk_limit burst=10 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Block direct access to sensitive files ────────────────────────────────
    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    location ~ /storage/app/db_backups {
        deny all;
        return 404;
    }

    # ── Static assets — long cache, no PHP ───────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Default location ──────────────────────────────────────────────────────
    location / {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_param  HTTPS on;

        # Timeouts
        fastcgi_read_timeout  120;
        fastcgi_send_timeout  120;
        fastcgi_connect_timeout 10;

        # Buffer tuning (reduce disk I/O)
        fastcgi_buffers       16 16k;
        fastcgi_buffer_size   32k;
    }

    # ── WebSocket proxy → Soketi ──────────────────────────────────────────────
    location /app/ {
        proxy_pass         http://soketi:6001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /apps/ {
        proxy_pass         http://soketi:6001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Block hidden files (dot-files) ────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }
}
