# Production /etc/nginx/nginx.conf — replaces the stock Debian config, which
# ships worker_connections=768 and html-only gzip. Tuned for the 2 vCPU / 4GB
# Fargate task fronted by Cloudflare + ALB. Server/vhost config lives in
# nginx-app.conf (copied to sites-enabled/default by the Dockerfile).

user www-data;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;

    keepalive_timeout 65;
    keepalive_requests 1000;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # http-level fallback only — the server block logs to /dev/stdout with the
    # main_timed format (CloudWatch); this file catches anything outside it.
    access_log /var/log/nginx/access.log;

    # Compress origin→Cloudflare responses (Inertia JSON payloads especially).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/wasm
        image/svg+xml
        font/ttf
        application/vnd.ms-fontobject;

    # Static assets are immutable (baked into the image) — cache fd/stat lookups.
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
