server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    client_max_body_size 20M;

    # Health check for ALB / ECS
    location = /_status {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Soketi WebSocket proxy (/app/ = subscribe, /apps/ = HTTP API)
    location ~ ^/(app|apps)/ {
        proxy_pass         http://127.0.0.1:9601;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass          127.0.0.1:9000;
        fastcgi_index         index.php;
        fastcgi_param         SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include               fastcgi_params;
        fastcgi_param         HTTPS on;
        fastcgi_read_timeout  120;
        fastcgi_send_timeout  120;
        fastcgi_buffers       16 16k;
        fastcgi_buffer_size   32k;
    }

    # Proxy /storage/ requests to S3 — ^~ prevents regex locations from stealing .jpg/.png etc.
    location ^~ /storage/ {
        proxy_pass         https://crcmis-mis-storage.s3.ap-southeast-1.amazonaws.com/;
        proxy_ssl_server_name on;
        proxy_set_header   Host crcmis-mis-storage.s3.ap-southeast-1.amazonaws.com;
        proxy_set_header   Authorization "";
        proxy_hide_header  x-amz-id-2;
        proxy_hide_header  x-amz-request-id;
        proxy_hide_header  Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }
}
