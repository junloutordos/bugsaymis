## ── Real client IP ────────────────────────────────────────────────────────────
# Behind Cloudflare→ALB, $remote_addr is the ALB node's private IP, so IP-keyed
# rate limits would lump ALL users into a handful of buckets. Trust the private
# ranges (ALB nodes) and take the client IP from CF-Connecting-IP — the ALB only
# accepts Cloudflare traffic, so the header is authoritative. ALB health checks
# carry no CF header and keep the ALB IP, but they only hit /_status (unlimited).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

## ── Rate-limiting zones ───────────────────────────────────────────────────────
# Defined at http context — included via sites-enabled so we declare them here;
# nginx silently ignores duplicate zone declarations if sizes match.
# Keyed on the REAL client IP (see real_ip above). Rates are sized for campus
# NAT: hundreds of users can share one public IP, so per-IP limits must stay
# generous while still stopping runaway bots and brute force.
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;

# combined + request/upstream timing + X-Forwarded-For (real client IP —
# $remote_addr behind Cloudflare/ALB is just the ALB node).
log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rt=$request_time urt="$upstream_response_time" xff="$http_x_forwarded_for"';

server {
    listen 80 backlog=4096;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    client_max_body_size 20M;

    # ── Logs → container stdout/stderr → CloudWatch (/ecs/crcmis) ─────────────
    # supervisord pipes nginx's fd1/fd2 to the container log stream; without
    # this, 5xx generated by nginx itself (e.g. upstream 502s) are invisible
    # outside the container.
    access_log /dev/stdout main_timed;
    error_log  /dev/stderr warn;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=(self), payment=()" always;

    # ── Health check for ALB / ECS ────────────────────────────────────────────
    location = /_status {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── Soketi REST API (Pusher HTTP API, HMAC-signed) ────────────────────────
    # Plain HTTP — used by the worker task (no soketi sidecar) to publish
    # broadcast events via the public hostname. No upgrade required here.
    location ^~ /apps/ {
        proxy_pass         http://127.0.0.1:9601;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Soketi — WebSocket only (Pusher protocol) ─────────────────────────────
    # Soketi does not implement Pusher's HTTP fallback transports; it closes
    # non-upgrade connections without a response, which nginx surfaces as 502.
    # Answer those with 426 Upgrade Required instead so they don't pollute the
    # ALB Target-5XX metric.
    location ~ ^/(app|pusher)/ {
        if ($http_upgrade !~* websocket) {
            return 426;
        }
        proxy_pass         http://127.0.0.1:9601;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # ── Rate-limited login endpoint ────────────────────────────────────────────
    location = /login {
        limit_req zone=login burst=15 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;

        # Prevent Cloudflare from caching PHP/HTML responses — ensures browsers
        # always get the latest Vite asset hashes after a deploy.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma        "no-cache" always;

        fastcgi_pass          127.0.0.1:9000;
        fastcgi_index         index.php;
        fastcgi_param         SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include               fastcgi_params;
        fastcgi_param         HTTPS on;
        fastcgi_read_timeout  120;
        fastcgi_send_timeout  120;
        fastcgi_buffers       16 16k;
        fastcgi_buffer_size   32k;
    }

    # ── Service Workers — must never be cached so updates are picked up promptly
    location ~* ^/(sw|crcmis-sw)\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # ── App storage proxy — all /media/* requests go through PHP (auth + S3) ──
    # Must be declared before the static-asset rule so image extensions don't
    # get intercepted by try_files and return 404.
    location ^~ /media/ {
        try_files $uri /index.php?$query_string;
    }

    # ── Mobile app storage proxy (AtlasGo, Sanctum-authenticated) — same reason
    # as /media/ above: without this, a poster path like .../test.jpg falls
    # through to the static-asset rule below and 404s at nginx before PHP
    # (and therefore Sanctum auth) ever sees the request.
    location ^~ /api/mobile/media/ {
        try_files $uri /index.php?$query_string;
    }

    # ── Static assets (public/build, favicons, etc.) ───────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Block sensitive files ──────────────────────────────────────────────────
    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }
}
