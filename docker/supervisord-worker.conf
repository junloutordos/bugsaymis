; Worker service supervisord config — cron (Laravel scheduler) + queue worker ONLY.
; Launched by `docker-entrypoint.sh worker` in the dedicated crcmis-prod-worker
; ECS service (single rolling task, NOT behind the ALB, NOT part of blue-green).
; The web container no longer runs these, so scheduled jobs and queued work fire
; exactly once even while blue + green web tasks overlap during a deploy.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
loglevel=warn
user=root

[program:cron]
command=cron -f
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null
priority=20

[program:queue-worker-default]
; Fast, single-unit jobs only (bell notifications, single-recipient sends,
; per-employee payroll computation, etc). Bulk/loop jobs are tagged
; ->onQueue('bulk') in their constructors and run on the separate
; queue-worker-bulk process below, so a large batch (e.g. a 300-recipient
; issuance release) can never head-of-line-block a fast job behind it.
; --timeout is short since nothing routed here should run long.
command=php /var/www/artisan queue:work redis --queue=default --sleep=3 --tries=1 --timeout=120 --max-jobs=500 --max-time=3600
directory=/var/www
user=www-data
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/var/log/queue-worker-default.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/queue-worker-default-error.log
stderr_logfile_maxbytes=5MB
priority=30

[program:queue-worker-bulk]
; Long-running batch jobs only (dispatched via ->onQueue('bulk')): issuance
; releases/resends, announcement/OED broadcast notifications, COA batch
; issuance, biometric file imports, and the AMS certificate/evaluation-link
; bulk senders. --timeout must stay < the queue connection retry_after
; (900s in config/queue.php) and >= the longest individual job timeout
; (ProcessIssuanceRelease = 600s).
; --tries=1 — per-job $tries is the source of truth; we surface failures
; rather than silently retry side-effectful work (PDF + 300+ emails).
command=php /var/www/artisan queue:work redis --queue=bulk --sleep=3 --tries=1 --timeout=700 --max-jobs=500 --max-time=3600
directory=/var/www
user=www-data
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/var/log/queue-worker-bulk.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/queue-worker-bulk-error.log
stderr_logfile_maxbytes=5MB
priority=31

[program:pulse-work]
; Consumes the Redis-buffered Pulse ingest stream and writes it to MySQL.
; Only runs here (never in the web/blue-green service) so recording never
; competes with request-serving workers — the whole reason Atlas WatchTower
; was designed this way after the LaraOwl incident.
command=php /var/www/artisan pulse:work
directory=/var/www
user=www-data
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/var/log/pulse-work.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/pulse-work-error.log
stderr_logfile_maxbytes=5MB
priority=40
