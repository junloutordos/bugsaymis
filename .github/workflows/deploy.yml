name: CRCMIS Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write # push release tags (vX.Y.Z)

env:
  AWS_REGION: ap-southeast-1
  ECR: 971422671747.dkr.ecr.ap-southeast-1.amazonaws.com
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # OTel boots during composer's post-autoload-dump artisan calls on this
  # runner too (no ADOT sidecar here) — keep it quiet outside the container.
  OTEL_SDK_DISABLED: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0 # full history + tags for release computation

      - name: Compute release version + changelog
        run: bash .github/scripts/compute-release.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, exif, pcntl, bcmath, gd, zip
          coverage: none

      - name: Update pinned security dependencies
        run: composer update setasign/fpdi minishlink/web-push --no-interaction --no-progress

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build and push app
        run: |
          SOKETI_KEY=$(aws ssm get-parameter \
            --name /crcmis/prod/SOKETI_DEFAULT_APP_KEY \
            --with-decryption \
            --query Parameter.Value \
            --output text)
          docker buildx build --platform linux/amd64 \
            --progress=plain \
            --build-arg VITE_STORAGE_BASE_URL=https://mis.crc.pshs.edu.ph/media \
            --build-arg VITE_PUSHER_HOST=mis.crc.pshs.edu.ph \
            --build-arg VITE_PUSHER_PORT=443 \
            --build-arg VITE_PUSHER_SCHEME=https \
            --build-arg VITE_PUSHER_APP_KEY=$SOKETI_KEY \
            --build-arg VITE_PUSHER_APP_CLUSTER=mt1 \
            --build-arg VITE_VAPID_PUBLIC_KEY=BGjayfMJ-1SnmGT9rb3rLrdBbUWM5418Zgqa0-ihCTef_EvmxejnBnC22AwVxKbI6-jcHC60KQalylpWV6FYXNU \
            -t $ECR/crcmis/app:${{ github.sha }} \
            --push .

      - name: Build and push nginx
        run: |
          docker buildx build --platform linux/amd64 \
            --progress=plain \
            -t $ECR/crcmis/nginx:${{ github.sha }} \
            -f nginx/Dockerfile \
            --push .

      - name: Update ECS task definition and deploy
        run: |
          # Get the current task definition used by the service
          CURRENT_TASK_DEF=$(aws ecs describe-services \
            --cluster crcmis-prod \
            --services crcmis-prod-service \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Current task definition: $CURRENT_TASK_DEF"

          # Fetch its full JSON, then replace image URIs for app and nginx containers
          NEW_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEF" \
            --query 'taskDefinition' \
            --output json | \
            jq --arg app "$ECR/crcmis/app:${{ github.sha }}" \
               --arg nginx "$ECR/crcmis/nginx:${{ github.sha }}" \
            '.containerDefinitions |= map(
              if (.image | contains("crcmis/app")) then .image = $app
              elif (.image | contains("crcmis/nginx")) then .image = $nginx
              else . end
            ) | del(
              .taskDefinitionArn, .revision, .status,
              .requiresAttributes, .compatibilities,
              .registeredAt, .registeredBy
            )')

          # Register the new revision and capture its ARN
          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "New task definition: $NEW_TASK_ARN"

          # ── Pre-deploy migration (blue-green safety) ──────────────────────────
          # Run migrations ONCE as a one-off task using the NEW image, BEFORE the
          # service is updated. Migrations no longer run on container boot. The
          # container's CMD (docker-entrypoint.sh) is overridden with the `migrate`
          # arg so it runs `artisan migrate --force` and exits. If this fails, the
          # job stops here and live traffic is never touched.
          NETCFG=$(aws ecs describe-services \
            --cluster crcmis-prod \
            --services crcmis-prod-service \
            --query 'services[0].networkConfiguration' \
            --output json)

          echo "Running pre-deploy migration task..."
          MIGRATE_TASK_ARN=$(aws ecs run-task \
            --cluster crcmis-prod \
            --task-definition "$NEW_TASK_ARN" \
            --launch-type FARGATE \
            --network-configuration "$NETCFG" \
            --started-by github-actions-migrate \
            --overrides '{"containerOverrides":[{"name":"nginx","command":["/usr/local/bin/docker-entrypoint.sh","migrate"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $MIGRATE_TASK_ARN"
          aws ecs wait tasks-stopped --cluster crcmis-prod --tasks "$MIGRATE_TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster crcmis-prod --tasks "$MIGRATE_TASK_ARN" \
            --query 'tasks[0].containers[?name==`nginx`].exitCode | [0]' \
            --output text)
          echo "Migration task exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Pre-deploy migration failed (exit $EXIT_CODE). Aborting deploy — live traffic untouched."
            exit 1
          fi
          echo "Migrations applied successfully."

          # Update the service to use the new revision
          aws ecs update-service \
            --cluster crcmis-prod \
            --service crcmis-prod-service \
            --task-definition "$NEW_TASK_ARN" \
            --force-new-deployment

      - name: Roll the worker service (cron + queue)
        run: |
          # The dedicated worker service runs cron + queue on its own image.
          # Skip cleanly if it doesn't exist yet (before Phase 1c infra is created).
          WORKER_STATUS=$(aws ecs describe-services \
            --cluster crcmis-prod \
            --services crcmis-prod-worker \
            --query 'services[0].status' \
            --output text 2>/dev/null || echo "MISSING")

          if [ "$WORKER_STATUS" != "ACTIVE" ]; then
            echo "Worker service not present (status=$WORKER_STATUS) — skipping."
            exit 0
          fi

          WORKER_TASK_DEF=$(aws ecs describe-services \
            --cluster crcmis-prod --services crcmis-prod-worker \
            --query 'services[0].taskDefinition' --output text)

          WORKER_NEW=$(aws ecs describe-task-definition \
            --task-definition "$WORKER_TASK_DEF" \
            --query 'taskDefinition' --output json | \
            jq --arg app "$ECR/crcmis/app:${{ github.sha }}" \
            '.containerDefinitions |= map(
              if (.image | contains("crcmis/app")) then .image = $app else . end
            ) | del(
              .taskDefinitionArn, .revision, .status,
              .requiresAttributes, .compatibilities,
              .registeredAt, .registeredBy
            )')

          WORKER_NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$WORKER_NEW" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service \
            --cluster crcmis-prod \
            --service crcmis-prod-worker \
            --task-definition "$WORKER_NEW_ARN" \
            --force-new-deployment
          echo "Worker service rolled to $WORKER_NEW_ARN"

      - name: Wait for blue/green deployment to finish
        run: |
          # The service uses the ECS-native BLUE_GREEN strategy, so the web rollout
          # is a "service deployment" that runs through scale-up → traffic shift →
          # bake → clean-up. The old runningCount==desired heuristic was wrong here:
          # it reported success as soon as green tasks were RUNNING, i.e. BEFORE the
          # traffic shift and bake. Instead, poll the service deployment to a terminal
          # state and fail the job if it rolled back.

          # Find the most recent service deployment for the web service.
          SD=""
          for i in $(seq 1 10); do
            SD=$(aws ecs list-service-deployments \
              --cluster crcmis-prod --service crcmis-prod-service \
              --query 'sort_by(serviceDeployments, &createdAt)[-1].serviceDeploymentArn' \
              --output text 2>/dev/null)
            [ -n "$SD" ] && [ "$SD" != "None" ] && break
            echo "Waiting for service deployment to appear... ($i)"
            sleep 10
          done
          echo "Tracking service deployment: $SD"

          # Poll to terminal. Timeout generous enough for scale-up + shift + bake + cleanup.
          for i in $(seq 1 60); do
            STATUS=$(aws ecs describe-service-deployments --service-deployment-arns "$SD" \
              --query 'serviceDeployments[0].status' --output text)
            STAGE=$(aws ecs describe-service-deployments --service-deployment-arns "$SD" \
              --query 'serviceDeployments[0].lifecycleStage' --output text)
            echo "[$i/60] status=$STATUS stage=$STAGE"
            case "$STATUS" in
              SUCCESSFUL)
                echo "Blue/green deployment succeeded." && exit 0 ;;
              ROLLBACK_SUCCESSFUL|ROLLBACK_FAILED|ROLLBACK_IN_PROGRESS|STOPPED|STOP_REQUESTED)
                echo "::error::Deployment did not succeed (status=$STATUS). Rolled back — live traffic remains on the previous (blue) version."
                exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::Timed out waiting for deployment to reach a terminal state (last status=$STATUS)."
          exit 1

      - name: Push release tag
        if: env.NEW_RELEASE == 'true'
        run: |
          # Only tag after the blue/green rollout confirmed SUCCESSFUL, so the
          # next release computes its changelog from what actually shipped.
          git tag "v${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"
          echo "Tagged v${RELEASE_VERSION}"
