name: CRCMIS Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-southeast-1
  ECR: 971422671747.dkr.ecr.ap-southeast-1.amazonaws.com
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend assets
        run: npm ci && npm run build
        env:
          VITE_STORAGE_BASE_URL: https://crcmis-mis-storage.s3.ap-southeast-1.amazonaws.com

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Build and push app
        run: |
          docker buildx build --platform linux/amd64 \
            --progress=plain \
            -t $ECR/crcmis/app:${{ github.sha }} \
            -t $ECR/crcmis/app:latest \
            --push .

      - name: Build and push nginx
        run: |
          docker buildx build --platform linux/amd64 \
            --progress=plain \
            -t $ECR/crcmis/nginx:${{ github.sha }} \
            -t $ECR/crcmis/nginx:latest \
            -f nginx/Dockerfile \
            --push .

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster crcmis-prod \
            --service crcmis-prod-service \
            --force-new-deployment

      - name: Wait for stable deployment
        run: |
          aws ecs wait services-stable \
            --cluster crcmis-prod \
            --services crcmis-prod-service
